# A neutral instance overlay for this repository's own spl-asdlc.toml:
# placeholder identities, no instance data (BR-ASDLC-001). The repository's
# file is incomplete alone; with this overlay it is complete.
# tests/own_config.rs checks the pair with this commit's code; pr.yml's job
# `config-latest-release` checks it with the latest published release, the
# one the host runs.
schema = 1

[product]
repository = "example-org/spl-asdlc"

[owner]
tracker_user = "owner-handle"

[tracker]
team = "ABC"
service_identity = "spl-asdlc"

[release]
release_please_authors = ["app/release-app"]
coordinators = ["coordinator-login"]

[review]
coordinators = ["coordinator-login"]
