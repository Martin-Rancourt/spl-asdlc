name: release-cut

# Example caller of asdlc-release-cut.yml: copy it to .github/workflows/ under
# this name (`[release] cut_workflow`), replace <owner>, and set the tag
# patterns and the component to the values of spl-asdlc.toml and of
# release-please-config.json. The bridge dispatches it with one input,
# `action`: `open` on the default branch, `candidate` on the release branch in
# flight. Every other input has a default. Run by hand, `dry_run` prints the
# plan and pushes nothing.

on:
  workflow_dispatch:
    inputs:
      action:
        description: '`open` a cycle from the default branch, or cut the next `candidate` on the release branch.'
        type: choice
        options: [open, candidate]
        default: open
        required: true
      class:
        description: '`routine` or `sensible`; empty computes it from .github/review-paths.json.'
        type: choice
        options: ['', routine, sensible]
        default: ''
      routine_because:
        description: Why `routine` holds on a delta that touches a reviewed path (recorded in the tag).
        type: string
        default: ''
      main_merge_because:
        description: Why a candidate is cut over commits the default branch handed the cycle (recorded in the tag).
        type: string
        default: ''
      dry_run:
        description: Print the plan; create, tag and push nothing.
        type: boolean
        default: false

concurrency:
  group: release-cut
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: read
    uses: <owner>/spl-asdlc/.github/workflows/asdlc-release-cut.yml@v1
    with:
      action: ${{ inputs.action }}
      class: ${{ inputs.class }}
      routine-because: ${{ inputs.routine_because }}
      main-merge-because: ${{ inputs.main_merge_because }}
      dry-run: ${{ inputs.dry_run }}
      candidate-tag: acme-v{version}-rc.{rc}
      release-tag: acme-v{version}
      component: acme
    secrets:
      SPL_ASDLC_APP_ID: ${{ secrets.SPL_ASDLC_APP_ID }}
      SPL_ASDLC_APP_PRIVATE_KEY: ${{ secrets.SPL_ASDLC_APP_PRIVATE_KEY }}
