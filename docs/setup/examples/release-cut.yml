name: release-cut

# Example caller of asdlc-release-cut.yml: copy it to .github/workflows/ under
# this name (`[release] cut_workflow`), replace <owner>, and set the tag
# patterns to the values of .spl-asdlc/config.toml. The bridge dispatches it with one
# input, `action`: `open` on the default branch, `candidate` on the release
# branch in flight (by hand: `gh workflow run release-cut.yml --ref
# release/<stamp>-utc -f action=candidate`, never `--ref main`). Every other
# input has a default. Run by hand, `dry_run` prints the plan and pushes
# nothing, and `version` forces the version `open` prepares.
#
# `open` creates the release branch, prepares the release on it with the
# published `spl-asdlc` binary of the channel `spl-asdlc-version` names
# (`spl-asdlc release prepare`: the version, the version files and the
# CHANGELOG, from the commits since the last release), commits
# `chore(release): v<X.Y.Z>` and pushes the branch with its first candidate,
# rc.1. It waits for no other workflow. `latest` follows the published
# releases; pin a release tag (`v<X.Y.Z>`) to choose when to move.

on:
  workflow_dispatch:
    inputs:
      action:
        description: '`open` a cycle from the default branch, or cut the next `candidate` on the release branch.'
        type: choice
        options: [open, candidate]
        default: open
        required: true
      class:
        description: '`routine` or `sensible`; empty computes it from the paths of the review angles.'
        type: choice
        options: ['', routine, sensible]
        default: ''
      routine_because:
        description: Why `routine` holds on a delta that touches a reviewed path (recorded in the tag).
        type: string
        default: ''
      main_merge_because:
        description: Why a candidate is cut over commits the default branch handed the cycle (recorded in the tag).
        type: string
        default: ''
      version:
        description: '`open` only: the version `X.Y.Z` to force; empty computes it from the commits since the last release.'
        type: string
        default: ''
      dry_run:
        description: Print the plan; create, commit, tag and push nothing.
        type: boolean
        default: false

concurrency:
  group: release-cut
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: read
    uses: <owner>/spl-asdlc/.github/workflows/asdlc-release-cut.yml@v1
    with:
      action: ${{ inputs.action }}
      class: ${{ inputs.class }}
      routine-because: ${{ inputs.routine_because }}
      main-merge-because: ${{ inputs.main_merge_because }}
      version: ${{ inputs.version }}
      dry-run: ${{ inputs.dry_run == true }}
      candidate-tag: acme-v{version}-rc.{rc}
      release-tag: acme-v{version}
      spl-asdlc-repository: <owner>/spl-asdlc
      spl-asdlc-version: latest
      # The summary names the gate `[release] gate_workflow` of this file
      # sets: no `gate-workflow` to repeat (`doctor` flags one that differs).
      config-file: .spl-asdlc/config.toml
    secrets:
      SPL_ASDLC_APP_ID: ${{ secrets.SPL_ASDLC_APP_ID }}
      SPL_ASDLC_APP_PRIVATE_KEY: ${{ secrets.SPL_ASDLC_APP_PRIVATE_KEY }}
