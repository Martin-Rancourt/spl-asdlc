name: pr

# Example caller of asdlc-pr-checks.yml and of the required-check action: copy
# it to .github/workflows/ and replace <owner> and the `make` commands with the
# project's own. One job runs every method check of a PR: the title, the
# branch's name and the guards. Its id is `guards` (the test jobs read
# `needs.guards.outputs.code`) and its name is `title`, so it reports the
# context `title / conventional-title`. The ruleset requires two contexts,
# `required-check` and that one (docs/setup/repository.md). `guards` is a
# need of `required-check` and never in `may-skip`: the action refuses a PR
# otherwise (BR-ASDLC-024), and a refused title fails `required-check` too.
#
# No path filter: a required check that never reports can never be satisfied
# (REQ-CI-022). The concurrency key holds the draft state, so the ready run
# never cancels itself against the draft one (REQ-CI-023). Every job of this
# file is a need of `required-check`, and only the jobs listed in `may-skip`
# may be skipped (REQ-CI-024, REQ-CI-025). A draft PR is out of the flow:
# every job, `required-check` included, runs only when the PR is not a draft
# (`if:`), so a draft run starts no runner. GitHub reports those skipped jobs, and a skipped job
# passes a required check: the bridge counts only a success, and marking the
# PR ready fires `ready_for_review`, whose run reports the check on the same
# head. A job added here gets the same condition.
#
# `edited` is a trigger so that a new title, or a new base, is checked again
# without a push: that run is a full run, the tests included, since
# `required-check` speaks for the whole head. An edit of anything else (the
# body) runs nothing: `guards` and `required-check` are skipped by their
# `if:`, and the jobs that need `guards` with it, so no runner starts. Such a
# run has a concurrency group of its own, so it cancels no run in progress,
# and its `required-check` is reported under another name, so its skip never
# replaces the check the last full run reported on the head. A job added
# here that does not need `guards` gets the same condition.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [main, 'release/**']

concurrency:
  group: pr-${{ github.ref }}-${{ github.event.pull_request.draft }}${{ github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base && format('-edit-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guards:
    name: title
    if: github.event.pull_request.draft == false && (github.event.action != 'edited' || github.event.changes.title || github.event.changes.base)
    permissions:
      contents: read
    uses: <owner>/spl-asdlc/.github/workflows/asdlc-pr-checks.yml@v1
    with:
      title: ${{ github.event.pull_request.title }}
      base-sha: ${{ github.event.pull_request.base.sha }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      head-ref: ${{ github.event.pull_request.head.ref }}
      base-ref: ${{ github.event.pull_request.base.ref }}
      head-repo: ${{ github.event.pull_request.head.repo.full_name }}
      # It also refuses a PR whose .spl-asdlc/process.md is not the page
      # of the version named after the @ above (docs/setup/repository.md,
      # "The process page").
      # The same list as the gate's (release-gate.yml): a guard that runs on
      # PRs also runs on the candidate, or carries a written exception (REQ-CI-033).
      guard-commands: '[{"name": "lint", "run": "make lint"}]'

  # The project's own suite: skipped on a prose-only PR (guards reports no
  # code), and on drafts as every job.
  test:
    needs: guards
    if: github.event.pull_request.draft == false && needs.guards.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Test
        run: make test

  # always(): it runs whatever its needs gave, but never on a draft, nor on
  # an edit that changes neither the title nor the base.
  required-check:
    name: ${{ (github.event.action != 'edited' || github.event.changes.title || github.event.changes.base) && 'required-check' || 'required-check (edit, not checked)' }}
    if: always() && github.event.pull_request.draft == false && (github.event.action != 'edited' || github.event.changes.title || github.event.changes.base)
    needs: [guards, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: <owner>/spl-asdlc/actions/required-check@v1
        with:
          needs: ${{ toJSON(needs) }}
          may-skip: test
