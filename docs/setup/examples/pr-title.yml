name: pr-title

# Example caller of asdlc-pr-title.yml: copy it to .github/workflows/ and
# replace <owner>. The title check is a workflow of its own, never a job of
# pr.yml (.spl-asdlc/requirements/ci.md, REQ-CI-018, REQ-CI-021): it re-runs on
# `edited`, and an edit in pr.yml's concurrency group would cancel the test
# run. Its context is `title / conventional-title`; whether the ruleset
# requires it is the project's choice. No `if:` anywhere: a skipped title
# check would read green.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [main, 'release/**']

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  title:
    permissions: {}
    uses: <owner>/spl-asdlc/.github/workflows/asdlc-pr-title.yml@v1
    with:
      title: ${{ github.event.pull_request.title }}
      head-ref: ${{ github.event.pull_request.head.ref }}
      base-ref: ${{ github.event.pull_request.base.ref }}
