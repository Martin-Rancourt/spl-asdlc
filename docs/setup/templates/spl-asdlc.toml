# spl-asdlc.toml: the configuration of one repository (docs/spec/08-configuration.md).
#
# Copy this file to the root of the repository, then replace every placeholder:
# `acme` (the product), `example-org/acme` (the repository), `ABC` (the tracker
# team) and the `*-handle` / `*-login` / `app/example-app` identities. The file
# is valid as written (the crate's test suite parses it), so `spl-asdlc config
# check --file spl-asdlc.toml` tells you what you broke while editing, never
# what you forgot to replace: read it through once.
#
# Keys commented out show their default; uncomment one only to change it. An
# unknown key, a wrong type or a repeated list entry makes the file invalid:
# nothing falls back to a default shape. No secret ever goes here: a channel's
# credentials are `env:<VARIABLE>` references resolved on the bridge's host.
#
# This is the light configuration: tickets, PRs, CI and the bridge, with no
# PR review (a PR merges on its CI) and no release cycle (a merged ticket is
# Done). "Layers", below the [review] section, shows the keys that add each
# part of the method when the project needs it: adding one is an edit of this
# file, with no migration (docs/setup/README.md, "Start light, add layers").

schema = 1

[product]
name = "acme"                          # lower-case letters, digits, hyphens; used in tags, labels, release issue titles
repository = "example-org/acme"        # <owner>/<repo> on GitHub

[owner]                                # the human of the method: escalations, human GO
tracker_user = "owner-handle"          # the owner as the tracker knows them
# github_login = "owner-login"         # required when release.go_policy = "human"

[tracker]
kind = "linear"                        # "linear" | "livela"
team = "ABC"                           # team key (Linear) or workspace id (Livela)
service_identity = "spl-asdlc"         # the service account the bridge writes as
team_keys = ["ABC"]                    # identifier prefixes of the team's items; [] asks the tracker
# link_fallback = "none"               # "none" | "body-url"
# No status mapping: the tracker names each canonical status exactly so
# (docs/spec/03-vocabulary.md, docs/setup/tracker-linear.md).

[review]
# merge_method = "squash"              # "squash" | "merge"
# require_up_to_date = true
# An angle by size is off by default: set both keys to add one above a threshold.
# diff_size_extra_angle = 0            # changed lines above which diff_size_angle is added; 0 adds none
# diff_size_angle = "maintainability"  # required while diff_size_extra_angle is above 0
# human_approval = "never"             # "never" | "sensitive-paths" | "always"
# sensitive_angle = "security"
# coordinator_assignee = "coordinator-handle" # tracker participant who receives each PR round's consolidation item
# human_reviewer = "owner-login"       # asked to look at a green PR stuck on a human
# ticketless_authors = []              # Apps whose PRs need no ticket, e.g. ["dependabot"]

# No PR review (docs/spec/04-pr-review.md §11), an explicit choice: no PR
# gets an angle, and each merges on its CI (contract complete, checks green,
# branch up to date, business-rule guard) with no round and no approval.
# Leaving the angles out altogether makes the file invalid.
angles = []                            # no base angle: layer 1 replaces it
# coordinators = ["coordinator-login"] # layers 1 and 4: GitHub logins whose approval at the head SHA merges a reviewed PR
# sensitive_paths = ".github/review-paths.json" # layer 4

# ---- Layers ----------------------------------------------------------------
#
# Each layer is added by keys alone, in this order or another, and applies
# from the bridge's next tick; removing it is the reverse edit.
#
# 1. PR review (standard; docs/spec/04-pr-review.md). Remove `angles = []`
#    under [review], uncomment `coordinators` there, and add one table per
#    base angle. Paths may add an angle too (`[[review.path_angles]]`,
#    docs/spec/08-configuration.md).
#
# [[review.angles]]
# key = "maintainability"
#
# 2. The release cycle with its gate (standard; docs/spec/05-release-cycle.md).
#    Uncomment the section, then add the release workflows, the release and
#    tag rulesets and release-please's files (docs/setup/repository.md, "A
#    light project"). Merged tickets now wait To Deploy for a release. With
#    `angles = []` the release has no QA angle: its GO rests on the gate. The
#    other release keys have defaults (docs/spec/08-configuration.md).
#
# [release]
# candidate_tag = "acme-v{version}-rc.{rc}"    # {version} once, {rc} once (never in release_tag); the callers pass the same patterns
# release_tag = "acme-v{version}"
# release_please_authors = ["app/example-app"] # the App that runs release-please (`app/<slug>`)
# bookkeeping_paths = [".release-please-manifest.json", "CHANGELOG.md"] # add the version files release-please writes
# angles = []                                  # no QA angle: layer 3 replaces it
#
# 3. Release QA angles (full; docs/spec/05-release-cycle.md §3). Replace
#    `angles = []` under [release] with the lines below, kept right after the
#    section's keys, and list the same keys in the publication caller's
#    `qa-angles`. Angles apply from the next candidate.
#
# coordinators = ["coordinator-login"]         # GitHub logins whose approval at the head SHA merges an angle PR
# [[release.angles]]
# key = "security"
# [[release.angles]]
# key = "product"
#
# 4. Sensitive paths (full; docs/spec/04-pr-review.md). Uncomment
#    `sensitive_paths` under [review] (and `coordinators`, if layer 1 did not)
#    and commit the list (templates/review-paths.json): a PR that touches one
#    of its paths gets the `sensitive_angle`. Once declared, the file must
#    exist and be valid at each PR's base, or every PR waits (spec 08 rule 5).

# [bridge]
# poll_minutes = 5
# github_identity = "app"              # "app" | "token"
# sweep_hours = 24

# Notification channels (optional). References only, never values.
# [[notify]]
# kind = "telegram"
# target = "env:SPL_ASDLC_TELEGRAM_CHAT"
# token = "env:SPL_ASDLC_TELEGRAM_TOKEN"
# events = ["release-note", "escalation", "stagnation", "stuck-pr", "blind-pass"]
