# This repository's own configuration (docs/spec/08-configuration.md): the
# method's shape only. The identities of the installation that runs the
# bridge on this repository (the repository slug, the owner, the tracker
# team, the logins, the angles' assignees, the channels) are in its instance
# overlay on that host, never here (BR-ASDLC-001, BR-ASDLC-014).
schema = 1

[product]
name = "spl-asdlc"

[tracker]
kind = "linear"

[tracker.statuses]
"To Deploy" = "To deploy"
"Post Deploy" = "Post deploy"

[release]
candidate_tag = "v{version}-rc.{rc}"
release_tag = "v{version}"
branch_prefix = "release/"
max_rc_passes = 2
go_policy = "computed"
# release-please's rust type bumps the version in Cargo.toml and Cargo.lock.
bookkeeping_paths = [".release-please-manifest.json", "CHANGELOG.md", "Cargo.toml", "Cargo.lock"]
registry_path = "docs/business-rules.md"
cut_workflow = "release-cut.yml"
gate_workflow = "release-gate.yml"
release_please_workflow = "release-please.yml"
release_please_config = "release-please-config.json"
release_please_manifest = ".release-please-manifest.json"
# One shared nits ticket: the tracker's plan limits the number of tickets.
nits = "shared"

[[release.angles]]
key = "security"

[review]
merge_method = "squash"
require_up_to_date = true
diff_size_extra_angle = 0
human_approval = "never"
sensitive_paths = ".github/review-paths.json"
sensitive_angle = "security"
ticketless_authors = ["dependabot"]

[[review.angles]]
key = "maintainability"

[bridge]
poll_minutes = 5
github_identity = "app"
sweep_hours = 24
