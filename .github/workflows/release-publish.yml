name: release-publish

# This repository's own caller of asdlc-release-publish.yml, as
# docs/setup/examples/release-publish.yml shows it, called from the release's
# commit (`./`). The workflow is called twice, with this repository's
# publication between the calls:
#
#   verify -> publish (binaries.yml) -> close
#
# A single component: record-deployed, the ledger the bridge reads for a
# multi-component product, is not called, and close checks no ledger
# (`components` is left empty).
#
# The trigger is the GitHub release that release-please creates as the
# bridge's App. A dispatch either resumes (republishes the release
# `release-tag` certified by the RC tag `resume-from`) or, with `replay` on the
# release branch, merges the branch back into the default branch and
# publishes nothing (docs/setup/repository.md, "Release close").
#
# verify and close get the same read permissions: a called job holds at most
# the permissions of the job that calls it, and `verify` reads Actions runs
# and pull requests. Their writes go through the App token, never
# GITHUB_TOKEN. The one write of GITHUB_TOKEN is binaries.yml's, which
# attaches the archives to the release: its `publish` caller grants
# `contents: write`, and binaries.yml keeps it to that one job.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-tag:
        description: The published release tag to resume; empty on a replay.
        type: string
        default: ''
      resume-from:
        description: The RC tag that certifies the release resumed; empty otherwise.
        type: string
        default: ''
      replay:
        description: Merge the release branch back only; dispatch on that branch.
        type: boolean
        default: false

concurrency:
  group: release-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.replay) }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/asdlc-release-publish.yml
    with:
      stage: verify
      release-tag: ${{ github.event.release.tag_name || inputs.release-tag }}
      resume-from: ${{ inputs.resume-from }}
      candidate-tag: v{version}-rc.{rc}
      release-tag-pattern: v{version}
      # What release-please changes after the RC: its manifest and changelog,
      # and the crate's version (the rust release type bumps Cargo.toml and
      # Cargo.lock).
      bookkeeping-paths: '[".release-please-manifest.json", "CHANGELOG.md", "Cargo.toml", "Cargo.lock"]'
      # The slug of the bridge's App. The release-please PR must have been
      # merged by this App or by a person (spec 09); any other bot is no GO.
      go-merger-login: spl-asdlc
      runs-on: ${{ startsWith(vars.SPL_ASDLC_RUNS_ON, '"') && fromJSON(vars.SPL_ASDLC_RUNS_ON) || vars.SPL_ASDLC_RUNS_ON || 'ubuntu-latest' }}

  # The publication: build and test the binary on every target from the
  # release tag, whose version is the crate's, and attach the archives and
  # their sums to the release. On a resume too the build is the release tag's,
  # not verify's `deploy-sha` (the RC's): the RC still carries the previous
  # version, and the two differ only by the bookkeeping verify allowed. A job
  # that calls a workflow takes no `environment:`.
  publish:
    needs: verify
    permissions:
      contents: write
    uses: ./.github/workflows/binaries.yml
    with:
      tag: ${{ github.event.release.tag_name || inputs.release-tag }}

  # Always called: its `closing-guard` turns a close that did not run after a
  # publication into a red run.
  close:
    needs: [verify, publish]
    if: ${{ always() }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/asdlc-release-publish.yml
    with:
      stage: close
      release-tag: ${{ github.event.release.tag_name || inputs.release-tag }}
      resume-from: ${{ inputs.resume-from }}
      replay: ${{ inputs.replay || false }}
      publish-result: ${{ needs.publish.result }}
    secrets:
      SPL_ASDLC_APP_ID: ${{ secrets.SPL_ASDLC_APP_ID }}
      SPL_ASDLC_APP_PRIVATE_KEY: ${{ secrets.SPL_ASDLC_APP_PRIVATE_KEY }}
