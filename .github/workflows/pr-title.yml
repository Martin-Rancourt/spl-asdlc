name: pr-title

# This repository's own caller of asdlc-pr-title.yml, as
# docs/setup/examples/pr-title.yml shows it, called from this commit (`./`).
# The title check is a workflow of its own, never a job of pr.yml
# (docs/requirements/ci.md, REQ-CI-018, REQ-CI-021): it re-runs on `edited`,
# and an edit in pr.yml's concurrency group would cancel the test run. Its
# context is `title / conventional-title`. No `if:` anywhere: a skipped title
# check would read green.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [main, 'release/**']

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  title:
    permissions: {}
    uses: ./.github/workflows/asdlc-pr-title.yml
    with:
      title: ${{ github.event.pull_request.title }}
      head-ref: ${{ github.event.pull_request.head.ref }}
      base-ref: ${{ github.event.pull_request.base.ref }}
      # The types of the changelog sections of release-please-config.json
      # (REQ-CI-016): a type without a section would ship in silence.
      allowed-types: build,chore,ci,docs,feat,fix,perf,refactor,revert,style,test
      runs-on: ${{ startsWith(vars.SPL_ASDLC_RUNS_ON, '"') && fromJSON(vars.SPL_ASDLC_RUNS_ON) || vars.SPL_ASDLC_RUNS_ON || 'ubuntu-latest' }}
