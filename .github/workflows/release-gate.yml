name: release-gate

# This repository's own caller of asdlc-release-gate.yml (`[release]
# gate_workflow`), as docs/setup/examples/release-gate.yml shows it, called
# from the candidate's commit (`./`). The push of an RC tag `v<X.Y.Z>-rc.<N>`
# is the trigger; the bridge reads this workflow's run on the tag, and only
# its conclusion `success` is green. A dispatch is for diagnostics only: it
# certifies nothing. release-gate-auto-rerun.yml reruns a red run once when it
# is a runner abort or a known flake.
#
# The suites are the checks pr.yml runs, on the exact candidate: rustfmt,
# clippy and the tests, each under `bash -e -o pipefail` with EVIDENCE_DIR,
# LAST_TAG, CANDIDATE, RELEASE_CLASS and HEAD_SHA set. The gate passes its
# suites static, non-secret values only, so the rule-zero scan, which reads
# the forbidden words from a secret, is this file's preflight: the gate runs
# no suite unless it succeeded.

on:
  push:
    tags: ['v*-rc.*']
  workflow_dispatch:
    inputs:
      release_class:
        description: Diagnostics only; empty reads the class from the tag.
        type: choice
        options: ['', routine, sensible]
        default: ''

concurrency:
  group: release-gate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # BR-ASDLC-001 on the exact commit.
  preflight:
    name: BR-ASDLC-001 — no instance data
    runs-on: ${{ fromJSON(vars.SPL_ASDLC_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Scan every tracked file
        env:
          # A repository secret or, failing that, a repository variable of the same name.
          SPL_ASDLC_FORBIDDEN_WORDS: ${{ secrets.SPL_ASDLC_FORBIDDEN_WORDS || vars.SPL_ASDLC_FORBIDDEN_WORDS }}
        run: bash scripts/check-no-instance-names.sh

  gate:
    needs: preflight
    if: always()
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/asdlc-release-gate.yml
    with:
      candidate-tag: v{version}-rc.{rc}
      release-tag: v{version}
      upstream-result: ${{ needs.preflight.result }}
      dispatch-class: ${{ inputs.release_class }}
      # The toolchain pr.yml installs with dtolnay/rust-toolchain; the suites
      # are commands, not steps, so rustup installs it here.
      setup-command: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update && rustup default stable
      # Zero tests is never a pass: `test` counts the tests that passed.
      suites: >-
        [{"id": "fmt", "run": "cargo fmt --all --check"},
         {"id": "clippy", "run": "cargo clippy --all-targets --locked -- -D warnings"},
         {"id": "test", "run": "cargo test --locked 2>&1 | tee \"$EVIDENCE_DIR/cargo-test.log\"; grep -c '^test .* ok$' \"$EVIDENCE_DIR/cargo-test.log\" > \"$EVIDENCE_DIR/tests-passed.json\"",
          "expect-nonempty": {"file": "tests-passed.json", "count": "."}}]
      # The same list as pr.yml's guards.
      guard-commands: '[]'
      runs-on: ${{ startsWith(vars.SPL_ASDLC_RUNS_ON, '"') && fromJSON(vars.SPL_ASDLC_RUNS_ON) || vars.SPL_ASDLC_RUNS_ON || 'ubuntu-latest' }}
