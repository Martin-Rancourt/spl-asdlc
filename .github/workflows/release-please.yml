name: release-please

# This repository's own release-please workflow, as
# docs/setup/examples/release-please.yml shows it (`[release]
# release_please_workflow`), with this repository's release-please-config.json
# and .release-please-manifest.json.
#
# It runs on a push to a release branch only (docs/requirements/ci.md,
# REQ-CI-098): the cut's branch push is its trigger, and the cut never
# dispatches it. A dispatch is kept for the bridge's single redispatch of a
# stale release PR, and is refused on any other ref: a run on the default
# branch would stage a version there. release-please opens its PR against the
# branch the run is on, never the default branch, and runs as the bridge's
# App (REQ-CI-099): with GITHUB_TOKEN its PR would get no checks, and the
# release it creates would start no publication workflow. Publication is
# release-publish.yml, on that release: nothing here publishes.

on:
  push:
    branches: ['release/**']
  workflow_dispatch:

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    runs-on: ${{ fromJSON(vars.SPL_ASDLC_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      releases-created: ${{ steps.release.outputs.releases_created }}
      prs-created: ${{ steps.release.outputs.prs_created }}
    steps:
      # On the full ref: a tag or a branch that merely contains `release/`
      # (feat/release/x) is refused.
      - name: Refuse any ref but a release branch
        env:
          REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          case "$REF" in
            refs/heads/release/?*) echo "Release branch: ${REF#refs/heads/}" ;;
            *)
              echo "::error title=Not a release branch::release-please runs on release/** only, not on '$REF'."
              exit 1
              ;;
          esac

      - name: Mint the App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SPL_ASDLC_APP_ID }}
          private-key: ${{ secrets.SPL_ASDLC_APP_PRIVATE_KEY }}

      - name: Run release-please against this release branch
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: ${{ github.ref_name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
