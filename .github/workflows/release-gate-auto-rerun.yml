name: release-gate-auto-rerun

# This repository's own caller of asdlc-release-gate-auto-rerun.yml, as
# docs/setup/examples/release-gate-auto-rerun.yml shows it. A `workflow_run`
# trigger cannot live in a reusable workflow, so this file owns it; GitHub
# runs it from the default branch, so the decision, the workflow it calls
# (`./`) and the known flakes it reads (.github/release-gate/known-flakes.json)
# are never the candidate's. It reruns a red gate run once, at its first
# attempt, when its suites never reported or every failed suite is an
# unexpired known flake. `workflows:` names the gate caller by its `name:`.

on:
  workflow_run:
    workflows: [release-gate]
    types: [completed]

permissions:
  contents: read

jobs:
  rerun:
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/asdlc-release-gate-auto-rerun.yml
