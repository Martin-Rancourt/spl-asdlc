name: publish

# The publication of a spl-asdlc release: once release-please (running as the
# App, release-please.yml) has published the GitHub release of a tag
# `v<X.Y.Z>`, binaries.yml builds and tests the binary on every target from
# that tag and attaches the archives and their sums to the release; then the
# minor tag `v<X.Y>` is moved to the release's commit and the crate is
# published on crates.io. Nothing else: this repository does not run the
# SPL-ASDLC release cycle on itself.
#
# Three writes, each in its job: binaries.yml's, which attaches the archives
# to the release (this caller grants `contents: write`, and binaries.yml
# keeps it to that one job), the minor tag's, and the crate's, with the
# crates.io token of the `crates-io` environment. The major tag `v<X>` is
# never moved here: it stays the owner's gesture
# (docs/setup/repository.md, "The workflows' tag").

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  binaries:
    permissions:
      contents: write
    uses: ./.github/workflows/binaries.yml
    with:
      tag: ${{ github.event.release.tag_name }}

  # A caller on `@v<X.Y>` gets every patch of that line. The tag moves only
  # once the binaries are attached: a release whose build or tests failed on
  # a target leaves the line on the previous patch, whose workflows and
  # binaries go together. GITHUB_TOKEN is enough, as for staging.yml's tag:
  # the tag ruleset protects the release tags `v<X.Y.Z>` and leaves
  # `v<X.Y>` movable, and no workflow starts on that tag.
  minor-tag:
    name: minor-tag
    needs: binaries
    runs-on: ${{ fromJSON(vars.SPL_ASDLC_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Move the minor tag
        run: |
          set -euo pipefail
          # Only a release `v<X.Y.Z>` has a minor line: a prerelease or a tag
          # of any other shape moves nothing.
          release_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [ "$PRERELEASE" = true ] || ! [[ "$TAG" =~ $release_re ]]; then
            echo "$TAG is not a published release v<X.Y.Z>: no tag moves."
            exit 0
          fi
          line="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          # Never backwards: a patch of the line published after a newer one
          # (a re-published release) leaves the tag on the newest.
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          if ! gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$work/releases"; then
            echo "::error title=Minor tag not moved::Could not list the releases of $GITHUB_REPOSITORY."
            exit 1
          fi
          if ! newest="$(jq -r --arg line "$line." '.[]
              | select((.draft | not) and (.prerelease | not))
              | .tag_name | select(startswith($line)) | ltrimstr($line)
              | select(test("^(0|[1-9][0-9]*)$"))' "$work/releases" | sort -n | tail -n 1)"; then
            echo "::error title=Minor tag not moved::The releases of $GITHUB_REPOSITORY could not be read as JSON."
            exit 1
          fi
          if [ -n "$newest" ] && [ "$newest" -gt "$patch" ]; then
            echo "$line stays on $line.$newest, newer than $TAG."
            exit 0
          fi
          if ! sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)" || ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Minor tag not moved::Could not read the commit of $TAG."
            exit 1
          fi
          # A lightweight tag moved through the API, as staging.yml moves
          # `staging`; created on the line's first release.
          if ! gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$line" \
              -f sha="$sha" -F force=true > /dev/null 2>&1; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$line" -f sha="$sha" > /dev/null
          fi
          echo "Moved $line to $TAG ($sha)."

  # The crate on crates.io, from the release's own tag, once its binaries
  # are built and tested on every target: a host application embeds
  # spl-asdlc by version (docs/reference/livela-contract.md §3). The token
  # is the secret CARGO_REGISTRY_TOKEN of the environment `crates-io`, whose
  # deployment rule admits the release tags `v<X.Y.Z>` only, and it reaches
  # the publish step only. A version crates.io already holds (a rerun, a
  # version published by hand) publishes nothing.
  crates-io:
    name: crates-io
    needs: binaries
    runs-on: ${{ fromJSON(vars.SPL_ASDLC_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - name: The version to publish
        id: version
        shell: bash
        run: |
          set -euo pipefail
          out="${GITHUB_OUTPUT:-/dev/stdout}"
          # Only a release `v<X.Y.Z>` is a crate version.
          release_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [ "$PRERELEASE" = true ] || ! [[ "$TAG" =~ $release_re ]]; then
            echo "$TAG is not a published release v<X.Y.Z>: nothing is published."
            echo "publish=false" >> "$out"
            exit 0
          fi
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error title=Crate not published::Cargo.toml says $version, the tag is $TAG."
            exit 1
          fi
          # crates.io answers 200 for a version it holds, 404 for one it does not.
          if ! status="$(curl -sS -o /dev/null -w '%{http_code}' \
              -A "spl-asdlc publish (github.com/$GITHUB_REPOSITORY)" \
              "https://crates.io/api/v1/crates/spl-asdlc/$version")"; then
            echo "::error title=Crate not published::crates.io could not be read."
            exit 1
          fi
          case "$status" in
            200)
              echo "spl-asdlc $version is already on crates.io: nothing is published."
              echo "publish=false" >> "$out"
              ;;
            404)
              echo "publish=true" >> "$out"
              ;;
            *)
              echo "::error title=Crate not published::crates.io answered $status for spl-asdlc $version."
              exit 1
              ;;
          esac
      - name: Publish
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error title=Crate not published::The environment crates-io has no secret CARGO_REGISTRY_TOKEN (.spl-asdlc/development.md, Releases)."
            exit 1
          fi
          cargo publish --locked
