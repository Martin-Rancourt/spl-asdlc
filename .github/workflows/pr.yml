name: pr

# This repository's own pull request check: the caller of asdlc-pr-guards.yml
# and of the required-check action, as docs/setup/examples/pr.yml shows them,
# called from this commit (`./`), so a PR exercises the workflows it changes.
# The ruleset requires one context, `required-check`; the title check lives
# in pr-title.yml.
#
# No path filter: a required check that never reports can never be satisfied
# (REQ-CI-022). The concurrency key holds the draft state, so the ready run
# never cancels itself against the draft one (REQ-CI-023). Every job of this
# file is a need of `required-check`, and only the jobs listed in `may-skip`
# may be skipped (REQ-CI-024, REQ-CI-025).
#
# No run on a push to main: the PR already ran on its merge commit, and the
# hosted minutes are a budget. Linux only: a macOS minute counts ten and a
# Windows minute two; binaries.yml builds and tests those once per release.
#
# The repository variable SPL_ASDLC_RUNS_ON (a JSON string such as
# "ubuntu-latest", or a JSON array of labels such as
# ["self-hosted","linux","x64"]) moves every job to another runner. A job of
# this file reads it with fromJSON; a reusable workflow takes a label or a
# JSON array, so a JSON string is decoded to its label before it is passed.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, 'release/**']

concurrency:
  group: pr-${{ github.ref }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guards:
    permissions:
      contents: read
    uses: ./.github/workflows/asdlc-pr-guards.yml
    with:
      base-sha: ${{ github.event.pull_request.base.sha }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      head-ref: ${{ github.event.pull_request.head.ref }}
      base-ref: ${{ github.event.pull_request.base.ref }}
      head-repo: ${{ github.event.pull_request.head.repo.full_name }}
      # Nothing here is prose: the tests read docs/spec/, docs/business-rules.md,
      # docs/setup/templates/ and docs/setup/examples/, and rule zero reads
      # every file. Only the licence text, which no test reads, skips the suite.
      prose-regex: '^LICENSE$'
      # The same list as the gate's (release-gate.yml): a guard that runs on
      # PRs also runs on the candidate, or carries a written exception
      # (REQ-CI-033). This repository's checks are jobs of their own.
      guard-commands: '[]'
      runs-on: ${{ startsWith(vars.SPL_ASDLC_RUNS_ON, '"') && fromJSON(vars.SPL_ASDLC_RUNS_ON) || vars.SPL_ASDLC_RUNS_ON || 'ubuntu-latest' }}

  # BR-ASDLC-001, on every PR, release-please's and drafts included: it reads
  # every tracked file and costs seconds.
  rule-zero:
    name: BR-ASDLC-001 — no instance data
    runs-on: ${{ fromJSON(vars.SPL_ASDLC_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan every tracked file
        env:
          # A repository secret or, failing that, a repository variable of the same name.
          SPL_ASDLC_FORBIDDEN_WORDS: ${{ secrets.SPL_ASDLC_FORBIDDEN_WORDS || vars.SPL_ASDLC_FORBIDDEN_WORDS }}
        run: bash scripts/check-no-instance-names.sh

  # The host runs the latest published release, never this commit
  # (docs/setup/bridge.md), and refuses a file with a key it does not know: a
  # merged change that release cannot read stops the bridge on this
  # repository. So this repository's spl-asdlc.toml, completed by the neutral
  # overlay tests/own_config.rs uses, is checked by that release's binary,
  # checksum verified. A new key enters the file only once a release that
  # knows it is installed (docs/agents/implement.md). On every PR, drafts and
  # release-please's included: it costs a download. Not a gate guard: the
  # host reads the default branch's file, and a PR to a release branch runs
  # it here. The archive is the x86_64 Linux one: the runners are x64.
  config-latest-release:
    name: spl-asdlc.toml — readable by the latest release
    runs-on: ${{ fromJSON(vars.SPL_ASDLC_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the file with the latest published release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET: x86_64-unknown-linux-gnu
          OVERLAY: tests/fixtures/own-config.instance.toml
        run: |
          work=$(mktemp -d)
          # The latest published release: neither a draft nor a prerelease.
          if ! tag=$(gh api "repos/$REPO/releases/latest" --jq .tag_name 2> "$work/err"); then
            if grep -q 'HTTP 404' "$work/err"; then
              echo "::notice::No published release of $REPO: no installed bridge to stay readable by, nothing to check."
              exit 0
            fi
            cat "$work/err" >&2
            exit 1
          fi
          asset="spl-asdlc-$tag-$TARGET.tar.gz"
          gh release download "$tag" --repo "$REPO" --dir "$work" --pattern "$asset" --pattern SHA256SUMS
          want=$(awk -v a="$asset" '$2 == a { print $1 }' "$work/SHA256SUMS")
          got=$(sha256sum "$work/$asset" | awk '{ print $1 }')
          if [ -z "$want" ] || [ "$want" != "$got" ]; then
            echo "::error::$asset: its SHA-256 is not the one the SHA256SUMS of $tag lists"
            exit 1
          fi
          tar xzf "$work/$asset" -C "$work"
          bin="$work/spl-asdlc-$tag-$TARGET/spl-asdlc"
          version=$("$bin" --version)
          if [ "$version" != "spl-asdlc ${tag#v}" ]; then
            echo "::error::$asset prints \"$version\", not the version of $tag"
            exit 1
          fi
          echo "spl-asdlc.toml with $OVERLAY, checked by $version, the latest published release:"
          if ! "$bin" config check --file spl-asdlc.toml --instance "$OVERLAY"; then
            echo "::error file=spl-asdlc.toml::spl-asdlc $tag, the release the host runs, refuses this file (the key is named above). A new key enters it only once a release that knows it is installed."
            exit 1
          fi

  # The cheap tier: also on drafts. Skipped on release-please's PRs (guards
  # reports no code); the gate validates the release.
  fmt:
    name: rustfmt
    needs: guards
    if: needs.guards.outputs.code == 'true'
    runs-on: ${{ fromJSON(vars.SPL_ASDLC_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  # The heavy tier: not on drafts (REQ-CI-029), nor on release-please's PRs.
  clippy:
    name: clippy
    needs: guards
    if: needs.guards.outputs.code == 'true' && github.event.pull_request.draft == false
    runs-on: ${{ fromJSON(vars.SPL_ASDLC_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: clippy
      # cache-bin off: its post step deletes every file of $CARGO_HOME/bin not
      # installed by `cargo install`, rustup included, which breaks a
      # self-hosted runner whose cargo home persists between jobs.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: "false"
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test
    needs: guards
    if: needs.guards.outputs.code == 'true' && github.event.pull_request.draft == false
    runs-on: ${{ fromJSON(vars.SPL_ASDLC_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      # cache-bin off: its post step deletes every file of $CARGO_HOME/bin not
      # installed by `cargo install`, rustup included, which breaks a
      # self-hosted runner whose cargo home persists between jobs.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: "false"
      - run: cargo test --locked

  # The action is this commit's, so it is checked out first.
  required-check:
    name: required-check
    if: always()
    needs: [guards, rule-zero, config-latest-release, fmt, clippy, test]
    runs-on: ${{ fromJSON(vars.SPL_ASDLC_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: actions/required-check
      - uses: ./actions/required-check
        with:
          needs: ${{ toJSON(needs) }}
          may-skip: fmt,clippy,test
