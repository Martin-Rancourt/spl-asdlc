name: asdlc-pr-guards

# Everything a pull request runs before merge that is not the project's own
# test suite, and nothing that can release or deploy
# (docs/requirements/ci.md, REQ-CI-022..034): the "does anything beyond prose
# change?" detector, the project's extra detectors, and its guard commands.
#
# The caller owns the trigger (pull_request on main and release/**, no path
# filter), the concurrency group keyed on the ref and the draft state, its test
# jobs gated on this job's `code` output, and the `required-check` aggregator
# (actions/required-check). The job this workflow guarantees is `guards`.

on:
  workflow_call:
    inputs:
      base-sha:
        description: The PR's base commit.
        type: string
        required: true
      head-sha:
        description: The PR's head commit.
        type: string
        required: true
      head-ref:
        description: The PR's head branch.
        type: string
        required: true
      base-ref:
        description: The PR's base branch.
        type: string
        required: true
      skip-head-prefixes:
        description: Comma list of head prefixes for which nothing runs (release-please's PRs).
        type: string
        default: release-please--
      prose-regex:
        description: ERE of the paths that never need the test suite (a denylist).
        type: string
        default: '(\.md$|^docs/)'
      detectors:
        description: >-
          JSON array of extra detectors: {"id", "skip-regex"} runs unless every
          path matches; {"id", "match-regex", "diff-filter"?} runs only when some
          path matches.
        type: string
        default: '[]'
      guard-commands:
        description: JSON array of {"name", "run"}; each runs with BASE_SHA, HEAD_SHA, HEAD_REF and BASE_REF set.
        type: string
        default: '[]'
      setup-command:
        description: Run once before the guard commands.
        type: string
        default: ''
      runs-on:
        description: A runner label, or a JSON array of labels.
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: The job's timeout.
        type: number
        default: 10
    outputs:
      code:
        description: '`true` unless every changed path is prose (or the PR is skipped).'
        value: ${{ jobs.guards.outputs.code }}
      detections:
        description: 'JSON object {"<detector id>": "true" | "false"}.'
        value: ${{ jobs.guards.outputs.detections }}
      skipped:
        description: '`true` when the head matched skip-head-prefixes.'
        value: ${{ jobs.guards.outputs.skipped }}

permissions:
  contents: read

jobs:
  guards:
    name: guards
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    outputs:
      code: ${{ steps.code.outputs.run || 'false' }}
      detections: ${{ steps.detectors.outputs.detections || '{}' }}
      skipped: ${{ steps.skip.outputs.skipped }}
    steps:
      - name: Skip the heads the release chain generates
        id: skip
        env:
          HEAD_REF: ${{ inputs.head-ref }}
          SKIP_PREFIXES: ${{ inputs.skip-head-prefixes }}
        shell: bash
        run: |
          set -euo pipefail
          out="${GITHUB_OUTPUT:-/dev/stdout}"
          IFS=',' read -r -a prefixes <<< "$SKIP_PREFIXES"
          for prefix in ${prefixes[@]+"${prefixes[@]}"}; do
            prefix="${prefix//[[:space:]]/}"
            if [ -n "$prefix" ] && [[ "$HEAD_REF" == "$prefix"* ]]; then
              echo "Skipped: '$HEAD_REF' is generated by the release chain; the gate validates the release."
              echo 'skipped=true' >> "$out"
              exit 0
            fi
          done
          echo 'skipped=false' >> "$out"

      - name: Check out the PR
        if: steps.skip.outputs.skipped != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Does anything beyond prose change?
        id: code
        if: steps.skip.outputs.skipped != 'true'
        env:
          BASE_SHA: ${{ inputs.base-sha }}
          HEAD_SHA: ${{ inputs.head-sha }}
          PROSE_RE: ${{ inputs.prose-regex }}
        shell: bash
        run: |
          set -euo pipefail
          out="${GITHUB_OUTPUT:-/dev/stdout}"
          # Fail closed (REQ-CI-027): only "every path is prose" skips the
          # suite. grep reads a file, never a pipe: under pipefail a `grep -q`
          # that quits early breaks its writer and the pipeline reads false.
          list="$(mktemp)"
          trap 'rm -f "$list"' EXIT
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "::warning::no base or head commit; running the test jobs."
            echo 'run=true' >> "$out"
            exit 0
          fi
          # --no-renames: a `git mv src/x.rs docs/x.md` must show the code
          # that disappeared, not only the prose it lands on.
          if ! git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" > "$list"; then
            echo "::warning::git diff $BASE_SHA $HEAD_SHA failed; running the test jobs."
            echo 'run=true' >> "$out"
            exit 0
          fi
          if [ ! -s "$list" ]; then
            echo "::warning::no changed path between $BASE_SHA and $HEAD_SHA; running the test jobs."
            echo 'run=true' >> "$out"
            exit 0
          fi
          if grep -qvE "$PROSE_RE" "$list"; then rc=0; else rc=$?; fi
          case "$rc" in
            0) echo 'run=true' >> "$out" ;;
            1)
              echo 'Prose-only change; the test jobs are skipped.'
              echo 'run=false' >> "$out"
              ;;
            *)
              echo "::warning::grep exited $rc while classifying the diff; running the test jobs."
              echo 'run=true' >> "$out"
              ;;
          esac

      - name: Extra detectors
        id: detectors
        if: steps.skip.outputs.skipped != 'true'
        env:
          BASE_SHA: ${{ inputs.base-sha }}
          HEAD_SHA: ${{ inputs.head-sha }}
          DETECTORS: ${{ inputs.detectors }}
        shell: bash
        run: |
          set -euo pipefail
          out="${GITHUB_OUTPUT:-/dev/stdout}"
          if ! jq -e 'type == "array"' > /dev/null <<< "$DETECTORS"; then
            echo "::error title=Invalid detectors::the detectors input is not a JSON array."
            exit 1
          fi
          count="$(jq 'length' <<< "$DETECTORS")"
          result='{}'
          list="$(mktemp)"
          trap 'rm -f "$list"' EXIT
          for ((i = 0; i < count; i++)); do
            id="$(jq -r ".[$i].id // \"\"" <<< "$DETECTORS")"
            skip_re="$(jq -r ".[$i][\"skip-regex\"] // \"\"" <<< "$DETECTORS")"
            match_re="$(jq -r ".[$i][\"match-regex\"] // \"\"" <<< "$DETECTORS")"
            filter="$(jq -r ".[$i][\"diff-filter\"] // \"\"" <<< "$DETECTORS")"
            if [ -z "$id" ] || { [ -z "$skip_re" ] && [ -z "$match_re" ]; } || { [ -n "$skip_re" ] && [ -n "$match_re" ]; }; then
              echo "::error title=Invalid detector::detector $i needs an id and exactly one of skip-regex or match-regex."
              exit 1
            fi
            args=(diff --no-renames --name-only)
            if [ -n "$filter" ]; then
              args+=("--diff-filter=$filter")
            fi
            verdict=true
            if git ${args[@]+"${args[@]}"} "$BASE_SHA" "$HEAD_SHA" > "$list"; then
              if [ -n "$skip_re" ]; then
                # A denylist: runs unless every path is one that cannot matter.
                if [ -s "$list" ]; then
                  if grep -qvE "$skip_re" "$list"; then rc=0; else rc=$?; fi
                  if [ "$rc" = 1 ]; then verdict=false; fi
                fi
              else
                # An allowlist: an extra run only when some path matches.
                if grep -qE "$match_re" "$list"; then rc=0; else rc=$?; fi
                if [ "$rc" = 1 ]; then verdict=false; fi
              fi
            else
              echo "::warning::git diff failed for detector '$id'; it runs."
            fi
            echo "Detector $id: $verdict"
            result="$(jq -c --arg k "$id" --arg v "$verdict" '. + {($k): $v}' <<< "$result")"
          done
          echo "detections=$result" >> "$out"

      - name: Set up the guard commands
        if: steps.skip.outputs.skipped != 'true' && inputs.setup-command != ''
        env:
          SETUP: ${{ inputs.setup-command }}
        shell: bash
        run: |
          set -euo pipefail
          bash -e -c "$SETUP"

      - name: Guard commands
        if: steps.skip.outputs.skipped != 'true'
        env:
          BASE_SHA: ${{ inputs.base-sha }}
          HEAD_SHA: ${{ inputs.head-sha }}
          HEAD_REF: ${{ inputs.head-ref }}
          BASE_REF: ${{ inputs.base-ref }}
          GUARDS: ${{ inputs.guard-commands }}
        shell: bash
        run: |
          set -euo pipefail
          if ! jq -e 'type == "array"' > /dev/null <<< "$GUARDS"; then
            echo "::error title=Invalid guard-commands::the guard-commands input is not a JSON array."
            exit 1
          fi
          count="$(jq 'length' <<< "$GUARDS")"
          failed=()
          for ((i = 0; i < count; i++)); do
            name="$(jq -r ".[$i].name // \"\"" <<< "$GUARDS")"
            cmd="$(jq -r ".[$i].run // \"\"" <<< "$GUARDS")"
            if [ -z "$name" ] || [ -z "$cmd" ]; then
              echo "::error title=Invalid guard command::guard $i needs a name and a run."
              exit 1
            fi
            echo "::group::$name"
            if bash -e -o pipefail -c "$cmd"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error title=Guard failed::$name"
              failed+=("$name")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            printf 'Failed guard(s): %s\n' "${failed[*]}"
            exit 1
          fi
          echo "$count guard(s) passed."
