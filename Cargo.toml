[package]
name = "spl-asdlc"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "The bridge of SPL-ASDLC: turns GitHub facts into tracker state and tracker state into GitHub actions."
license = "Apache-2.0"
readme = "README.md"
publish = false

[lib]
name = "spl_asdlc"
path = "src/lib.rs"

[[bin]]
name = "spl-asdlc"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
jsonwebtoken = { version = "11.1", default-features = false, features = ["use_pem", "rust_crypto"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
toml = "1.1"
ureq = { version = "3.4", default-features = false, features = ["rustls", "gzip"] }

[dev-dependencies]

[profile.release]
strip = true
lto = "thin"
