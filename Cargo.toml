[package]
name = "spl-asdlc"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "The bridge of SPL-ASDLC: turns GitHub facts into tracker state and tracker state into GitHub actions."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/Martin-Rancourt/spl-asdlc"
keywords = ["sdlc", "release", "github", "linear", "agents"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[lib]
name = "spl_asdlc"
path = "src/lib.rs"

[[bin]]
name = "spl-asdlc"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
jsonwebtoken = { version = "11.1", default-features = false, features = ["use_pem", "rust_crypto"] }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
toml = "1.1"
ureq = { version = "3.4", default-features = false, features = ["rustls", "gzip"] }

[dev-dependencies]
rand = "0.8"
# The workflow shape tests parse the shipped YAML (tests/workflows/).
yaml-rust2 = "0.13"
rsa = { version = "0.9", features = ["pem"] }

# RSA key generation in the App tests is slow without optimisation.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

[profile.release]
strip = true
lto = "thin"
